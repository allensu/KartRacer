name: Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Relay server tests
        working-directory: server
        run: npm install && npm test

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot && mv ~/godot/Godot_v* ~/godot/godot
          curl -sSL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -j -o tpl.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"

      - name: Import project
        run: ~/godot/godot --headless --import || true

      - name: Smoke test (AI drives a full 8-kart race)
        run: timeout 300 ~/godot/godot --headless --fixed-fps 60 -s res://tests/autodrive_test.gd

      - name: Online smoke test (host + 1 client through the relay)
        run: |
          (cd server && PORT=8090 node server.js &)
          sleep 1
          rm -f /tmp/room.txt
          timeout 360 ~/godot/godot --headless -s res://tests/net_test.gd -- host ws://localhost:8090 2 /tmp/room.txt &
          host=$!
          sleep 3
          timeout 360 ~/godot/godot --headless -s res://tests/net_test.gd -- client ws://localhost:8090 2 /tmp/room.txt
          wait $host

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Upload playable build (zip)
        uses: actions/upload-artifact@v4
        with:
          name: kartracer-web
          path: build/web

      - name: Upload for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
