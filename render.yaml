# Render Blueprint for the KartRacer relay server (free plan).
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: kartracer-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
